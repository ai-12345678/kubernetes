<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Kubernetes 扩展体系</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 20px;
    background: #ffffff;
  }
  h1 { font-size: 20px; font-weight: 500; }
  #diagram { margin-top: 24px; }
</style>
</head>
<body>
<h1>Kubernetes 扩展体系</h1>
<div id="diagram"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  layout: 'dagre',
  securityLevel: 'loose',
  flowchart: {
    padding: 6,
    nodeSpacing: 12,
    rankSpacing: 12,
  },
  theme: 'base',
  themeVariables: {
    fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: '14px',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    primaryColor: '#E6F1FB',
    primaryBorderColor: '#185FA5',
    primaryTextColor: '#0C447C',
    clusterBkg: '#F7F7F5',
    clusterBorder: '#B9B8B1',
    noteBkgColor: '#EEEDFE',
    noteBorderColor: '#534AB7',
    noteTextColor: '#3C3489',
  },
});

const definition = `flowchart TB

    subgraph L1["👤 客户端"]
        direction LR
        kubectl["kubectl"]
        kubeconfig["kubeconfig exec 插件"]
        kubectl --> kubeconfig
    end

    subgraph L2["🧠 kube-apiserver"]
        direction TB
        subgraph L2a["webhook"]
            direction LR
            Auth["Authentication\nWebhook / OIDC"]
            Authz["Authorization\nRBAC / Webhook"]
            Admission["Admission\nMutatingWebhook / ValidatingWebhook\nValidatingAdmissionPolicy"]
            Auth --> Authz --> Admission
        end
        subgraph APIExt["API Extension"]
            CRDAgg["CRD  /  Aggregation API / APIService"]
        end
    end

    subgraph L3["⚙️ 控制面扩展"]
        direction LR
        Ctrl["Controller / Operator\n自定义 Controller"]
        CCM["Cloud Controller Manager"]
        Metrics["Custom / External Metrics API\nHPA 扩展"]
    end

    subgraph L4["📅 kube-scheduler"]
        direction LR
        Framework["Scheduler Framework Plugin\n编译进二进制"]
        Extender["Scheduler Extender\n独立服务 HTTP 调用"]
        CustomSched["Custom Scheduler\n自研调度器"]
    end

    subgraph L5["🖥️ Node / kubelet"]
        direction LR
        CRI["CRI\n容器运行时"]
        CNI["CNI\n网络插件"]
        CSI["CSI\n存储插件"]
        Device["Device Plugin / DRA\n异构硬件"]
        ImageCred["Image Credential Provider\n镜像凭据"]
    end

    kubectl -. "kubectl Plugin / krew" .-> L2
    L2 -- "watch" --> L3
    L2 -- "Pod 创建" --> L4
    L4 -- "绑定节点" --> L5
    L5 --> CRI
    L5 --> CNI
    L5 --> CSI
    L5 --> Device
    L5 --> ImageCred

    style L2a fill:none,stroke:#B9B8B1,stroke-dasharray: 4 3
    style APIExt fill:none,stroke:#B9B8B1,stroke-dasharray: 4 3
    style CRDAgg fill:#E6F1FB,stroke:#185FA5
    style L1 fill:#eef,stroke:#446
    style L2 fill:#efe,stroke:#464
    style L3 fill:#ffe,stroke:#664
    style L4 fill:#fee,stroke:#644
    style L5 fill:#eff,stroke:#466`;

const { svg } = await mermaid.render('k8s-ext-svg', definition);
document.getElementById('diagram').innerHTML = svg;
</script>
</body>
</html>
