<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Pod 创建与调度时序图</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
    background: #ffffff;
  }
  h1 { font-size: 20px; font-weight: 500; }
  #diagram { margin-top: 24px; }
</style>
</head>
<body>
<h1>Pod 创建与调度时序图</h1>
<div id="diagram"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  themeVariables: {
    fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: '14px',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    actorBkg: '#E6F1FB',
    actorBorder: '#185FA5',
    actorTextColor: '#0C447C',
    signalColor: '#73726c',
    signalTextColor: '#3d3d3a',
    noteBkgColor: '#EEEDFE',
    noteBorderColor: '#534AB7',
    noteTextColor: '#3C3489',
  },
});

const definition = `sequenceDiagram
  participant CM as controller-manager
  participant A as kube-apiserver
  participant E as etcd
  participant S as kube-scheduler
  participant K as kubelet
  CM->>A: 创建 Pod 请求
  Note over A: Authentication → Authorization → Admission
  A->>E: 写入 Pod(nodeName 为空)
  E-->>A: watch 事件通知
  A-->>S: 通知有未调度 Pod
  Note over S: Filter → Score → Bind
  S->>A: Bind 绑定请求
  A->>E: 更新 Pod.spec.nodeName
  E-->>A: watch 事件通知
  A-->>K: 通知 kubelet 有新 Pod
  Note over K: 调用 CRI/CNI/CSI/Device Plugin
  K->>A: 更新 Pod status(Running)`;

const { svg } = await mermaid.render('pod-seq-svg', definition);
document.getElementById('diagram').innerHTML = svg;
</script>
</body>
</html>
