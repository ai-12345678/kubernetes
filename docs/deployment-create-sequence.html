<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Deployment 创建时序图</title>
<style>
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    background: #ffffff;
  }
  h1 { font-size: 20px; font-weight: 500; }
  #diagram { margin-top: 24px; }
</style>
</head>
<body>
<h1>Deployment 创建时序图</h1>
<div id="diagram"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  themeVariables: {
    fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    fontSize: '14px',
    lineColor: '#73726c',
    textColor: '#3d3d3a',
    actorBkg: '#E6F1FB',
    actorBorder: '#185FA5',
    actorTextColor: '#0C447C',
    signalColor: '#73726c',
    signalTextColor: '#3d3d3a',
    noteBkgColor: '#EEEDFE',
    noteBorderColor: '#534AB7',
    noteTextColor: '#3C3489',
  },
});

const definition = `sequenceDiagram
  participant C as client
  participant A as kube-apiserver
  participant E as etcd
  participant CM as controller-manager
  C->>A: kubectl apply (提交 Deployment)
  Note over A: Authentication → Authorization → Admission
  A->>E: 写入 Deployment
  E-->>A: watch 事件通知
  A-->>CM: Deployment 变化通知
  CM->>A: 创建 ReplicaSet 请求
  A->>E: 写入 ReplicaSet`;

const { svg } = await mermaid.render('seq-svg', definition);
document.getElementById('diagram').innerHTML = svg;
</script>
</body>
</html>
